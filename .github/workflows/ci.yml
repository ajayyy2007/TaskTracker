name: Build and test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main   
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v4
      - name: compose building
        run: docker compose -f compose.yml build
      - name: compose up
        run: docker compose -f compose.yml up -d
      - name: compose ps to check
        run: docker compose ps
      - name: sleeping
        run: sleep 10
      - name: curling to check if it ran
        run: curl --fail http://localhost:3000
      - name: docker login 
        uses: docker/login-action@v4
        with:
          username: $${{ secrets.DOCKER_USERNAME }}
          password: $${{ secrets.DOCKER_PASSWORD }}
      - name: image tagging
        run: |
          docker tag fullapp.v1 $${{ secrets.DOCKER_USERNAME }}/tasktracker:v1
      - name: image pushing
        run: docker push $${{ secrets.DOCKER_USERNAME }}/tasktracker:v1

